name: Atlas Autoformat (Temporary)

on:
  push:
    branches: [feat/observatory-design-foundation]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format and organize new frontend
        run: pnpm exec biome check --write apps/web/components/research-graph.tsx apps/web/components/atlas-overview.tsx apps/web/components/immersive-workspace.tsx apps/web/app/atlas.css scripts/smoke-ui.mjs || true
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/research-graph.tsx apps/web/components/atlas-overview.tsx apps/web/components/immersive-workspace.tsx apps/web/app/atlas.css scripts/smoke-ui.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(atlas): autoformat and organize frontend code"
            git push origin HEAD:feat/observatory-design-foundation
          fi
