name: Re:Gap Browser Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: Browser journeys (desktop and mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install project dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Next.js
        run: pnpm exec turbo run build --filter=web
      - name: Install browser testing tools
        run: |
          npm install --prefix /tmp/regap-playwright --no-save --no-package-lock playwright@1.56.1
          /tmp/regap-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Start production server
        run: |
          pnpm --filter web start >/tmp/regap-next-server.log 2>&1 &
      - name: Test real browser workflows
        run: node scripts/smoke-ui.mjs
