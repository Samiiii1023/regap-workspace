name: Apply ReGap quality formatting

on:
  push:
    branches:
      - feat/immersive-research-workspace

permissions:
  contents: write

concurrency:
  group: format-regap-branch
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Biome formatting and safe fixes
        run: pnpm exec biome check --write apps/web/components/immersive-workspace.tsx apps/web/components/add-gap-dialog.tsx apps/web/hooks/use-persistent-state.ts apps/web/hooks/use-modal-focus.ts apps/web/lib/research-data.ts apps/web/lib/research-data.test.mjs apps/web/app/workspace.css scripts/smoke-ui.mjs
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/immersive-workspace.tsx apps/web/components/add-gap-dialog.tsx apps/web/hooks/use-persistent-state.ts apps/web/hooks/use-modal-focus.ts apps/web/lib/research-data.ts apps/web/lib/research-data.test.mjs apps/web/app/workspace.css scripts/smoke-ui.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(web): normalize frontend formatting and imports"
            git push origin HEAD:feat/immersive-research-workspace
          fi
