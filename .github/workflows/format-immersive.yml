name: Format immersive workspace

on:
  push:
    branches:
      - feat/immersive-research-workspace

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Biome format and safe fixes
        run: pnpm exec biome check --write apps/web/app/layout.tsx apps/web/app/workspace.css apps/web/components/immersive-workspace.tsx apps/web/components/research-graph.tsx
      - name: Commit formatted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/layout.tsx apps/web/app/workspace.css apps/web/components/immersive-workspace.tsx apps/web/components/research-graph.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(web): apply Biome formatting and safe fixes"
            git push origin HEAD:feat/immersive-research-workspace
          fi
